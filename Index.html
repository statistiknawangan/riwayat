<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <title>RIWAYAT LAPORAN — SIPLAH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>S</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* ============ IFRAME ============ */
    .iframe-container {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100dvh;
      border: none;
      background: white;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    iframe.loaded {
      opacity: 1;
    }

    /* ============ LOADING ============ */
    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      z-index: 10;
      transition: opacity 0.3s ease;
      padding: 24px;
      text-align: center;
    }
    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 22px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
    }

    .loading-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .loading-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-fallback {
      margin-top: 22px;
      font-size: 12px;
      color: #94a3b8;
      display: none;
      line-height: 1.5;
    }
    .loading-fallback a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .loading-fallback a:hover { text-decoration: underline; }

    /* ============ ERROR ============ */
    .error {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }
    .error.show { display: flex; }

    .error-icon {
      width: 52px;
      height: 52px;
      background: #fef2f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #dc2626;
      margin-bottom: 14px;
    }
    .error-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .error-msg {
      font-size: 13px;
      color: #64748b;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 18px;
    }
    .error-btn {
      padding: 10px 22px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .error-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <!-- LOADING -->
  <div class="loading" id="loading">
    <div class="loading-logo">S</div>
    <div class="loading-title">Transport Lokal</div>
    <div class="loading-subtitle">Memuat formulir...</div>
    <div class="loading-spinner"></div>
    <div class="loading-fallback" id="fallback">
      Halaman terlalu lama dimuat?<br>
      <a href="#" id="manualLink">Buka di tab baru</a>
    </div>
  </div>

  <!-- ERROR -->
  <div class="error" id="error">
    <div class="error-icon">
      <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>
    <div class="error-title">Gagal Memuat Halaman</div>
    <div class="error-msg" id="errorMsg">
      Tidak dapat terhubung ke server. Periksa koneksi internet Anda lalu coba lagi.
    </div>
    <button class="error-btn" onclick="reloadApp()">Coba Lagi</button>
  </div>

  <!-- IFRAME -->
  <div class="iframe-container">
    <iframe
      id="app"
      src="about:blank"
      scrolling="yes"
      allow="clipboard-write; clipboard-read; fullscreen"
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <script>
    // ============================================================
    // ⚠️ KONFIGURASI — UBAH DI SINI
    // ============================================================

    // URL Apps Script /exec terbaru
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwpWkEkAXFSDSpx7Vpn5de_Sib8FNoPXjmXVrtQPuomfgc4zqnw38kKBGmDfkpml72btQ/exec';

    // Halaman ini untuk apa
    // Opsi:
    //   { type: 'form', template: 'TRANSPORT_LOKAL' }   → Form Translok
    //   { type: 'form', template: 'PPPK_KEAMANAN' }     → Form PPPK
    //   { type: 'form', template: 'NON_TRANSPORT' }     → Form Non Translok
    //   { type: 'riwayat' }                             → Halaman Riwayat
    const PAGE = {
      type: 'form',
      template: 'TRANSPORT_LOKAL'
    };

    // ============================================================
    // JANGAN UBAH DI BAWAH INI (kecuali Anda tahu caranya)
    // ============================================================

    const iframe = document.getElementById('app');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const fallback = document.getElementById('fallback');
    const manualLink = document.getElementById('manualLink');
    const errorMsg = document.getElementById('errorMsg');

    let loaded = false;
    let fallbackTimer;
    let errorTimer;

    // Bangun URL target
    function buildUrl() {
      let url = APPS_SCRIPT_URL;

      if (PAGE.type === 'riwayat') {
        url += '?path=riwayat';
      } else {
        url += '?path=app&template=' + encodeURIComponent(PAGE.template);
      }

      // Forward parameter dari URL halaman ini (kalau ada)
      // Misal: https://username.github.io/siplah-translok/?edit=xxx
      const params = new URLSearchParams(window.location.search);
      params.forEach(function(value, key) {
        if (key !== 'path' && key !== 'template') {
          url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(value);
        }
      });

      return url;
    }

    function loadApp() {
      const targetUrl = buildUrl();

      console.log('[SIPLAH] Loading:', targetUrl);

      // Reset
      loaded = false;
      loading.classList.remove('hidden');
      loading.style.display = 'flex';
      error.classList.remove('show');
      iframe.classList.remove('loaded');

      // Set link fallback
      manualLink.href = targetUrl;

      // Load
      iframe.src = targetUrl;

      // Timer 10 detik: tampilkan link fallback
      clearTimeout(fallbackTimer);
      fallbackTimer = setTimeout(function() {
        if (!loaded) fallback.style.display = 'block';
      }, 10000);

      // Timer 25 detik: tampilkan error
      clearTimeout(errorTimer);
      errorTimer = setTimeout(function() {
        if (!loaded) {
          showError('Koneksi lambat atau server tidak merespons. Silakan coba lagi.');
        }
      }, 25000);
    }

    function showError(msg) {
      loading.style.display = 'none';
      error.classList.add('show');
      if (msg) errorMsg.textContent = msg;
    }

    function reloadApp() {
      loadApp();
    }

    // Event: iframe loaded
    iframe.addEventListener('load', function() {
      try {
        // Kalau masih about:blank, berarti belum benar-benar load
        if (iframe.contentWindow && iframe.contentWindow.location.href === 'about:blank') {
          return;
        }
      } catch (e) {
        // Cross-origin → berarti sudah load halaman eksternal (Apps Script)
        // Ini normal, lanjutkan
      }

      loaded = true;
      clearTimeout(fallbackTimer);
      clearTimeout(errorTimer);

      // Fade out loading
      loading.classList.add('hidden');
      setTimeout(function() {
        loading.style.display = 'none';
      }, 300);

      // Fade in iframe
      iframe.classList.add('loaded');
    });

    iframe.addEventListener('error', function() {
      if (!loaded) showError('Gagal memuat halaman. Periksa koneksi internet Anda.');
    });

    // Auto-load saat halaman siap
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadApp);
    } else {
      loadApp();
    }
  </script>

</body>
</html>
